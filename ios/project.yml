name: PortLab
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  PortLab:
    type: application
    platform: iOS
    sources:
      - Sources
      - Native
      - path: ../native/resource
      - path: ../native/render
        excludes:
          - vulkan
      - path: Resources
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Port Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.portlab
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: NO
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      SWIFT_OBJC_BRIDGING_HEADER: Native/PortLab-Bridging-Header.h
      HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../native/include
schemes:
  PortLab:
    build:
      targets:
        PortLab: all
    run:
      config: Debug
