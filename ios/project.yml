name: PortLab
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  PortLab:
    type: application
    platform: iOS
    sources:
      - Sources
      - Native
      - path: ../native/resource
      - path: ../native/render
        excludes:
          - vulkan/shaders
      - path: Resources
        type: folder
        buildPhase: resources
      - path: Generated/MoltenVKNotices
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleDisplayName: Port Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.example.portlab
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: NO
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      SWIFT_OBJC_BRIDGING_HEADER: Native/PortLab-Bridging-Header.h
      HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../native/include
        - $(SRCROOT)/../native/render/vulkan
        - $(SRCROOT)/Generated/sprite-shaders
        - $(SRCROOT)/../.tools/moltenvk-1.4.2/MoltenVK/MoltenVK/include
      OTHER_LDFLAGS:
        - $(inherited)
        - -lc++
    dependencies:
      - framework: ../.tools/moltenvk-1.4.2/MoltenVK/MoltenVK/static/MoltenVK.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreGraphics.framework
schemes:
  PortLab:
    build:
      targets:
        PortLab: all
    run:
      config: Debug
