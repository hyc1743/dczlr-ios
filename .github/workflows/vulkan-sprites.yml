name: Verify Vulkan sprite pixels
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan CPU driver and shader tools
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools ninja-build
      - name: Build the actual backend
        run: |
          cmake -S native -B out/vulkan -G Ninja -DPORTLAB_VULKAN_SPRITES=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build out/vulkan
      - name: Validate actual Vulkan draws and pixel readback on lavapipe
        shell: bash
        run: |
          set -euo pipefail
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          out/vulkan/vulkan_sprite_gate 2>&1 | tee out/vulkan/pixel-gate.log
          ! grep -q 'Vulkan validation error' out/vulkan/pixel-gate.log
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('out/vulkan/report.json').write_text(json.dumps({
              'revision': os.environ['GITHUB_SHA'], 'driver': 'Mesa lavapipe software Vulkan',
              'pixel_gate': 'passed', 'validation_layer': 'VK_LAYER_KHRONOS_validation',
              'original_gpu_equivalence': 'unverified', 'apple_gpu': 'not exercised',
              'game_playability': 'not verified'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: vulkan-sprite-pixels
          path: |
            out/vulkan/pixel-gate.log
            out/vulkan/report.json
            out/vulkan/sprite-shaders/
  apple:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned public-API MoltenVK and shader tools
        run: |
          brew install glslang spirv-tools
          python3 tools/bootstrap_moltenvk.py
          python3 tools/build_sprite_shaders.py --output out/apple-vulkan/shaders
      - name: Build and run the same pixel gate through MoltenVK
        shell: bash
        run: |
          set -euo pipefail
          base=.tools/moltenvk-1.4.2/MoltenVK/MoltenVK
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -Inative/render/vulkan -Iout/apple-vulkan/shaders -I"$base/include" \
            tests/native/test_vk_sprite.c native/render/vulkan/dc_vk_sprite.c \
            native/render/dc_sprite.c native/render/dc_sprite_vertices.c \
            native/game/dc_pose.c native/game/dc_camera.c native/render/dc_mesh_clip.c \
            "$base/static/MoltenVK.xcframework/macos-arm64_x86_64/libMoltenVK.a" \
            -framework Metal -framework QuartzCore -framework Foundation -framework IOKit \
            -framework IOSurface -framework AppKit -framework CoreGraphics -lc++ \
            -o out/apple-vulkan/pixel-gate
          out/apple-vulkan/pixel-gate --no-validation 2>&1 | tee out/apple-vulkan/pixel-gate.log
      - name: Run the pixel gate with an actual Metal surface and Vulkan swapchain
        shell: bash
        run: |
          set -euo pipefail
          base=.tools/moltenvk-1.4.2/MoltenVK/MoltenVK
          xcrun clang -O2 -Wall -Wextra -Werror -fobjc-arc -DPORTLAB_GATE_NO_MAIN \
            -Inative/include -Inative/render/vulkan -Iout/apple-vulkan/shaders -I"$base/include" \
            tests/native/test_vk_metal_surface.m tests/native/test_vk_sprite.c native/render/vulkan/dc_vk_sprite.c \
            native/render/dc_sprite.c native/render/dc_sprite_vertices.c \
            native/game/dc_pose.c native/game/dc_camera.c native/render/dc_mesh_clip.c \
            "$base/static/MoltenVK.xcframework/macos-arm64_x86_64/libMoltenVK.a" \
            -framework Metal -framework QuartzCore -framework Foundation -framework IOKit \
            -framework IOSurface -framework AppKit -framework CoreGraphics -lc++ \
            -o out/apple-vulkan/surface-gate
          out/apple-vulkan/surface-gate 2>&1 | tee out/apple-vulkan/surface-gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: moltenvk-sprite-pixels
          path: out/apple-vulkan/
