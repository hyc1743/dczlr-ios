name: Verify real Wine console boot without JIT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-win32-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guest execution evidence rules
        run: python3 -m unittest discover -s tests -p test_wine_boot_evidence.py -v
      - name: Compile the self-authored 32-bit Windows probe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686
          mkdir -p out/win32-probe
          i686-w64-mingw32-gcc -std=c11 -Os -Wall -Wextra -Werror -static \
            probes/win32_smoke.c -o out/win32-probe/portlab-win32-smoke.exe -lgdi32 -luser32 -lwinmm
          file out/win32-probe/portlab-win32-smoke.exe
      - uses: actions/upload-artifact@v4
        with:
          name: self-authored-win32-probe
          path: out/win32-probe/portlab-win32-smoke.exe
  wine-boot:
    needs: compile-win32-probe
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: self-authored-win32-probe
          path: out/win32-probe
      - name: Stage pinned actual interpreter host
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/boxedvn-wine-boot"
          git init "$upstream"
          git -C "$upstream" fetch --depth=1 https://github.com/125hz/BoxedVN.git 7b6e03575922967ca161f2b55c39846e242916f6
          git -C "$upstream" checkout --detach FETCH_HEAD
          python3 tools/prepare_wine_boot_probe.py "$upstream"
      - name: Compile the genuine host without test-only flags
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja sdl2
          cmake -S "$RUNNER_TEMP/boxedvn-wine-boot" -B "$RUNNER_TEMP/wine-boot-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBOXEDVN_BUILD_TESTS=OFF -DBOXEDVN_BUILD_RUNTIME=OFF \
            -DBOXEDVN_BUILD_MACOS_HOST=OFF -DBOXEDVN_ENABLE_UI=OFF \
            -DBOXEDVN_ENABLE_MIDI=ON -DBOXEDVN_ENABLE_GUEST_X64=OFF \
            -DBOXEDVN_ENABLE_FEX64=OFF -DBOXEDVN_SDL2_ROOT="$(brew --prefix sdl2)"
          cmake --build "$RUNNER_TEMP/wine-boot-build" --target portlab_wine_host --parallel 3 -- -k 0
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/TinyCore15Wine11.0.zip
          key: wine11-rootfs-41835c49ce0e582a1d7a610243a8e4a95bc59996fb780c09705dc476bb9b6493
      - name: Fetch and authenticate the upstream Wine runtime
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/TinyCore15Wine11.0.zip"
          if [ ! -f "$target" ]; then
            curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 300 \
              https://boxedwine.org/v2/7/TinyCore15Wine11.0.zip -o "$target"
          fi
          echo "41835c49ce0e582a1d7a610243a8e4a95bc59996fb780c09705dc476bb9b6493  $target" | shasum -a 256 -c -
      - name: Execute real Wine and require cmd.exe output
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_wine_boot_probe.py "$RUNNER_TEMP/wine-boot-build/portlab_wine_host" \
            "$RUNNER_TEMP/TinyCore15Wine11.0.zip" --output out/wine-boot --seconds 240
      - name: Verify Win32 files, threads, GDI pixels and audio buffer completion
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_wine_boot_probe.py "$RUNNER_TEMP/wine-boot-build/portlab_wine_host" \
            "$RUNNER_TEMP/TinyCore15Wine11.0.zip" --output out/win32-smoke --seconds 240 \
            --guest-exe out/win32-probe/portlab-win32-smoke.exe
      - name: Retain only bounded execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-boot-evidence
          path: |
            out/wine-boot/wine-console.log
            out/wine-boot/wine-boot-report.json
            out/win32-smoke/wine-console.log
            out/win32-smoke/wine-boot-report.json
            out/win32-probe/portlab-win32-result.txt
            ${{ runner.temp }}/wine-boot-build/compile_commands.json
          if-no-files-found: ignore
