name: Build PortLab iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: "Build the unsigned device IPA after Apple-side gameplay validation"
        required: false
        default: false
        type: boolean
      resource_bundle_url:
        description: "HTTPS URL of the AES-GCM encrypted resource bundle for simulator gameplay"
        required: false
        default: ""
        type: string
      resource_bundle_sha256:
        description: "SHA-256 of resource_bundle_url"
        required: false
        default: ""
        type: string
      resource_bundle_urls:
        description: "Comma-separated HTTPS URLs for ordered encrypted bundle chunks"
        required: false
        default: ""
        type: string
      resource_bundle_sha256s:
        description: "Comma-separated SHA-256 values for resource_bundle_urls"
        required: false
        default: ""
        type: string
      resource_repo:
        description: "Private repository owner/name containing verified DczlrData parts"
        required: false
        default: ""
        type: string
      resource_ref:
        description: "Branch, tag or commit of resource_repo"
        required: false
        default: "main"
        type: string
      resource_path:
        description: "Path inside resource_repo containing manifest and dczdata parts"
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate resource manifest and packer
        shell: bash
        run: |
          python -m py_compile tools/pack_resources.py tools/validate_effect_manifest.py tools/validate_release_contract.py
          python tools/validate_release_contract.py .
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('ios/Resources/DczlrData.manifest.json').read_text())
          assert m['format']=='dczlr-resource-parts-v1'
          assert m['part_bytes'] <= 1_000_000_000
          assert all(p['size'] <= m['part_bytes'] for p in m['parts'])
          print(f"{m['file_count']} files, {len(m['parts'])} parts, {m['total_bytes']} bytes")
          PY

  ios:
    needs: portable
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator test dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Install XcodeGen
        run: brew install xcodegen glslang spirv-tools
      - name: Prepare pinned MoltenVK and self-authored shaders
        run: |
          python3 tools/bootstrap_moltenvk.py --notices-output ios/Generated/MoltenVKNotices
          python3 tools/build_sprite_shaders.py --output ios/Generated/sprite-shaders
      - name: Start the pinned simulator while building
        run: python3 tools/check_ios_sprite.py --boot-only --runtime iOS-18-5 --output out/ios-sprite
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build unsigned simulator app
        working-directory: ios
        run: |
          xcodebuild -project PortLab.xcodeproj -scheme PortLab -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO ENABLE_DEBUG_DYLIB=NO build
      - name: Checkout private resource repository
        if: inputs.resource_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.resource_repo }}
          ref: ${{ inputs.resource_ref }}
          token: ${{ secrets.DCZLR_RESOURCE_REPO_TOKEN }}
          path: private-resources
          lfs: true
          sparse-checkout: |
            ${{ inputs.resource_path }}
          sparse-checkout-cone-mode: false
      - name: Prepare plaintext private resource parts
        if: inputs.resource_repo != ''
        env:
          RESOURCE_PATH: ${{ inputs.resource_path }}
        run: |
          PARTS="$GITHUB_WORKSPACE/private-resources/$RESOURCE_PATH"
          test -f "$PARTS/DczlrData.manifest.json"
          test -f "$PARTS/DczlrData.part001.dczdata"
          test -f "$PARTS/DczlrData.part002.dczdata"
          test -f "$PARTS/DczlrData.part003.dczdata"
          echo "DCZLR_RESOURCE_PARTS=$PARTS" >> "$GITHUB_ENV"
      - name: Download and decrypt private resource bundle
        if: inputs.resource_repo == '' && (inputs.resource_bundle_url != '' || inputs.resource_bundle_urls != '')
        env:
          DCZLR_RESOURCE_KEY: ${{ secrets.DCZLR_RESOURCE_KEY }}
          RESOURCE_BUNDLE_URL: ${{ inputs.resource_bundle_url }}
          RESOURCE_BUNDLE_SHA256: ${{ inputs.resource_bundle_sha256 }}
          RESOURCE_BUNDLE_URLS: ${{ inputs.resource_bundle_urls }}
          RESOURCE_BUNDLE_SHA256S: ${{ inputs.resource_bundle_sha256s }}
        run: |
          test -n "$DCZLR_RESOURCE_KEY"
          if [ -n "$RESOURCE_BUNDLE_URLS" ]; then
            test -n "$RESOURCE_BUNDLE_SHA256S"
            IFS=',' read -ra URLS <<< "$RESOURCE_BUNDLE_URLS"
            IFS=',' read -ra HASHES <<< "$RESOURCE_BUNDLE_SHA256S"
            test "${#URLS[@]}" -eq "${#HASHES[@]}"
            : > "$RUNNER_TEMP/dczlr-resources.dczenc"
            for i in "${!URLS[@]}"; do
              curl --fail --location --retry 3 "${URLS[$i]}" -o "$RUNNER_TEMP/dczlr-resource.$i.part"
              echo "${HASHES[$i]}  $RUNNER_TEMP/dczlr-resource.$i.part" | shasum -a 256 -c -
              cat "$RUNNER_TEMP/dczlr-resource.$i.part" >> "$RUNNER_TEMP/dczlr-resources.dczenc"
            done
          else
            test -n "$RESOURCE_BUNDLE_SHA256"
            curl --fail --location --retry 3 "$RESOURCE_BUNDLE_URL" -o "$RUNNER_TEMP/dczlr-resources.dczenc"
            echo "$RESOURCE_BUNDLE_SHA256  $RUNNER_TEMP/dczlr-resources.dczenc" | shasum -a 256 -c -
          fi
          python3 tools/encrypted_resource_parts.py unpack \
            --input "$RUNNER_TEMP/dczlr-resources.dczenc" \
            --output "$RUNNER_TEMP/dczlr-resource-parts" \
            --key-env DCZLR_RESOURCE_KEY
      - name: Upload simulator app and manifest
        uses: actions/upload-artifact@v4
        with:
          name: PortLab-simulator-and-resources
          path: |
            ios/build/ci/Build/Products/Debug-iphonesimulator/PortLab.app
            ios/Resources/DczlrData.manifest.json
      - name: Launch the Vulkan sprite scene on iPhone simulator
        timeout-minutes: 8
        run: |
          python3 tools/check_ios_sprite.py --app ios/build/ci/Build/Products/Debug-iphonesimulator/PortLab.app --runtime iOS-18-5 --output out/ios-sprite
      - name: Exercise startup and New Game with generated resources
        timeout-minutes: 8
        run: |
          python3 tools/check_ios_sprite.py --app ios/build/ci/Build/Products/Debug-iphonesimulator/PortLab.app --runtime iOS-18-5 --expected-scene intro --startup-fixture --exercise-new-game --output out/ios-startup
      - name: Exercise real resource gameplay on simulator
        if: inputs.resource_repo != '' || inputs.resource_bundle_url != '' || inputs.resource_bundle_urls != ''
        timeout-minutes: 12
        run: |
          python3 tools/check_ios_sprite.py \
            --app ios/build/ci/Build/Products/Debug-iphonesimulator/PortLab.app \
            --runtime iOS-18-5 --expected-scene gameComplete \
            --exercise-new-game \
            --exercise-real-gameplay \
            --resource-parts "${DCZLR_RESOURCE_PARTS:-$RUNNER_TEMP/dczlr-resource-parts}" \
            --output out/ios-real-gameplay
      - name: Upload simulator Vulkan execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PortLab-simulator-vulkan-scene
          path: out/ios-sprite/
      - name: Upload generated startup execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PortLab-simulator-startup
          path: out/ios-startup/
      - name: Upload real gameplay evidence
        if: always() && (inputs.resource_repo != '' || inputs.resource_bundle_url != '' || inputs.resource_bundle_urls != '')
        uses: actions/upload-artifact@v4
        with:
          name: PortLab-simulator-real-gameplay
          path: out/ios-real-gameplay/
          if-no-files-found: ignore

  unsigned-ipa:
    if: inputs.build_ipa == true
    needs: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen glslang spirv-tools
      - name: Prepare pinned MoltenVK and self-authored shaders
        run: |
          python3 tools/bootstrap_moltenvk.py --notices-output ios/Generated/MoltenVKNotices
          python3 tools/build_sprite_shaders.py --output ios/Generated/sprite-shaders
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild -project PortLab.xcodeproj -scheme PortLab -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/PortLab.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../DCZL-R-unsigned.ipa" Payload)
      - name: Write build status report
        working-directory: ios
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = {
              'product': 'DCZL-R-unsigned.ipa',
              'host_build': 'compiled_by_xcodebuild',
              'native_guest': 'native_reimplementation_linked',
              'native_resource_module': 'PP, BMP/TGA/EMA, XA clip/material/node keys, XX readers, map chain, actor/face morphs, collision, save/load and gameplay menu profile linked; device execution unverified',
              'graphics_backend': 'native indexed skinning, startup/title/text and chapter-3 map/actor scene through Vulkan/MoltenVK; original effects, full script semantics and physical GPU equivalence remain unverified',
              'game_playability': 'Windows local playable-loop verified; Apple simulator/device playability unverified',
              'resource_manifest': 'embedded',
              'resource_parts': 'external local user files; not bundled or published by this workflow',
              'signing': 'unsigned',
          }
          Path('build/build-report.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DCZL-R-unsigned-ipa
          path: |
            ios/build/DCZL-R-unsigned.ipa
            ios/build/build-report.json
            ios/Resources/DczlrData.manifest.json
