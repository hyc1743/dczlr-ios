name: Build PortLab iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ipa-build

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native test compiler
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang
      - name: Validate resource manifest and packer
        shell: bash
        run: |
          python -m py_compile tools/pack_resources.py tools/validate_effect_manifest.py tools/validate_release_contract.py
          python tools/validate_release_contract.py .
          for test_file in \
            test_release_contract.py \
            test_pack_resources.py \
            test_shader_conversion.py \
            test_shader_bindings.py \
            test_dx9_tokens.py \
            test_dx9_effect.py \
            test_wine_boot_evidence.py \
            test_ios_scene_evidence.py; do
            python -m unittest discover -s tests -p "$test_file" -q
          done
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('ios/Resources/DczlrData.manifest.json').read_text())
          assert m['format']=='dczlr-resource-parts-v1'
          assert m['part_bytes'] <= 1_000_000_000
          assert all(p['size'] <= m['part_bytes'] for p in m['parts'])
          print(f"{m['file_count']} files, {len(m['parts'])} parts, {m['total_bytes']} bytes")
          PY

  ios:
    needs: portable
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen glslang spirv-tools
      - name: Prepare pinned MoltenVK and self-authored shaders
        run: |
          python3 tools/bootstrap_moltenvk.py --notices-output ios/Generated/MoltenVKNotices
          python3 tools/build_sprite_shaders.py --output ios/Generated/sprite-shaders
      - name: Start the pinned simulator while building
        run: python3 tools/check_ios_sprite.py --boot-only --runtime iOS-18-5 --output out/ios-sprite
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build unsigned simulator app
        working-directory: ios
        run: |
          xcodebuild -project PortLab.xcodeproj -scheme PortLab -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO ENABLE_DEBUG_DYLIB=NO build
      - name: Upload simulator app and manifest
        uses: actions/upload-artifact@v4
        with:
          name: PortLab-simulator-and-resources
          path: |
            ios/build/ci/Build/Products/Debug-iphonesimulator/PortLab.app
            ios/Resources/DczlrData.manifest.json
      - name: Launch the Vulkan sprite scene on iPhone simulator
        timeout-minutes: 8
        run: |
          python3 tools/check_ios_sprite.py --app ios/build/ci/Build/Products/Debug-iphonesimulator/PortLab.app --runtime iOS-18-5 --output out/ios-sprite
      - name: Exercise startup and New Game with generated resources
        timeout-minutes: 8
        run: |
          python3 tools/check_ios_sprite.py --app ios/build/ci/Build/Products/Debug-iphonesimulator/PortLab.app --runtime iOS-18-5 --expected-scene intro --startup-fixture --exercise-new-game --output out/ios-startup
      - name: Upload simulator Vulkan execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PortLab-simulator-vulkan-scene
          path: out/ios-sprite/
      - name: Upload generated startup execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PortLab-simulator-startup
          path: out/ios-startup/

  unsigned-ipa:
    needs: portable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen glslang spirv-tools
      - name: Prepare pinned MoltenVK and self-authored shaders
        run: |
          python3 tools/bootstrap_moltenvk.py --notices-output ios/Generated/MoltenVKNotices
          python3 tools/build_sprite_shaders.py --output ios/Generated/sprite-shaders
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild -project PortLab.xcodeproj -scheme PortLab -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/PortLab.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../PortLab-unsigned.ipa Payload)
      - name: Write build status report
        working-directory: ios
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = {
              'product': 'PortLab-unsigned.ipa',
              'host_build': 'compiled_by_xcodebuild',
              'native_guest': 'not_embedded',
              'native_resource_module': 'PP, BMP/TGA/EMA, XA clip/material/node keys and XX readers linked; device execution unverified',
              'graphics_backend': 'native indexed skinning, startup/title/text and script adapter through Vulkan/MoltenVK; nonscript gameplay, effects, broader input/backlog and font fidelity unfinished',
              'game_playability': 'not_claimed',
              'resource_manifest': 'embedded',
              'resource_parts': 'external local user files; not bundled or published by this workflow',
              'signing': 'unsigned',
          }
          Path('build/build-report.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PortLab-unsigned-ipa
          path: |
            ios/build/PortLab-unsigned.ipa
            ios/build/build-report.json
            ios/Resources/DczlrData.manifest.json

  publish-ipa:
    needs: unsigned-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PortLab-unsigned-ipa
          path: out/release
      - name: Publish public unsigned IPA release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ipa-${GITHUB_SHA:0:7}"
          ipa="$(find out/release -name PortLab-unsigned.ipa -type f -print -quit)"
          report="$(find out/release -name build-report.json -type f -print -quit)"
          manifest="$(find out/release -name DczlrData.manifest.json -type f -print -quit)"
          test -n "$ipa" -a -n "$report" -a -n "$manifest"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" \
              --notes "Unsigned iOS build for ${GITHUB_SHA}. Sign with your own Apple identity before installation. Game resource parts remain local and are not published." \
              --target "$GITHUB_SHA"
          gh release upload "$tag" "$ipa" "$report" "$manifest" --clobber
