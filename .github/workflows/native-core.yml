name: Verify reconstructed native modules on ARM64 and iPhoneOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run native C behavior tests on ARM64 macOS
        run: |
          python3 - <<'PY'
          import platform
          assert platform.machine() == 'arm64', platform.machine()
          PY
          python3 -m unittest discover -s tests -p 'test_native*.py' -v
      - name: Compile the reconstructed modules for an iOS device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/native-iphoneos
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/resource/dc_pp.c -o out/native-iphoneos/dc_pp.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/resource/dc_image.c -o out/native-iphoneos/dc_image.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/resource/dc_xa.c -o out/native-iphoneos/dc_xa.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/resource/dc_xx.c -o out/native-iphoneos/dc_xx.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/resource/dc_xl.c -o out/native-iphoneos/dc_xl.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/resource/dc_eyeneck.c -o out/native-iphoneos/dc_eyeneck.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/render/dc_sprite.c -o out/native-iphoneos/dc_sprite.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/render/dc_sprite_vertices.c -o out/native-iphoneos/dc_sprite_vertices.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_startup.c -o out/native-iphoneos/dc_startup.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_animation.c -o out/native-iphoneos/dc_animation.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_material.c -o out/native-iphoneos/dc_material.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_pose.c -o out/native-iphoneos/dc_pose.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_scene.c -o out/native-iphoneos/dc_scene.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_model.c -o out/native-iphoneos/dc_model.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/render/dc_mesh.c -o out/native-iphoneos/dc_mesh.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_menu.c -o out/native-iphoneos/dc_menu.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_save.c -o out/native-iphoneos/dc_save.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/resource/dc_script.c -o out/native-iphoneos/dc_script.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_text.c -o out/native-iphoneos/dc_text.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_skin.c -o out/native-iphoneos/dc_skin.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_camera.c -o out/native-iphoneos/dc_camera.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_gameplay.c -o out/native-iphoneos/dc_gameplay.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_story.c -o out/native-iphoneos/dc_story.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/render/dc_mesh_clip.c -o out/native-iphoneos/dc_mesh_clip.o
          xcrun --sdk iphoneos libtool -static out/native-iphoneos/dc_pp.o out/native-iphoneos/dc_image.o out/native-iphoneos/dc_xa.o out/native-iphoneos/dc_xx.o out/native-iphoneos/dc_xl.o out/native-iphoneos/dc_eyeneck.o out/native-iphoneos/dc_sprite.o out/native-iphoneos/dc_sprite_vertices.o out/native-iphoneos/dc_startup.o out/native-iphoneos/dc_animation.o out/native-iphoneos/dc_material.o out/native-iphoneos/dc_pose.o out/native-iphoneos/dc_scene.o out/native-iphoneos/dc_model.o out/native-iphoneos/dc_mesh.o out/native-iphoneos/dc_menu.o out/native-iphoneos/dc_save.o out/native-iphoneos/dc_script.o out/native-iphoneos/dc_text.o out/native-iphoneos/dc_skin.o out/native-iphoneos/dc_camera.o out/native-iphoneos/dc_mesh_clip.o out/native-iphoneos/dc_gameplay.o out/native-iphoneos/dc_story.o \
            -o out/native-iphoneos/libportlab_native.a
          file out/native-iphoneos/dc_pp.o
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          result = {'source_revision': os.environ['GITHUB_SHA'],
              'modules': ['indexed PP resource reader and byte codec', 'BMP/TGA/EMA RGBA decoder', 'bounded XA framing, numeric clips and material keys', 'sprite draw submission plan and vertex generation', 'two-card startup update action planner', 'animation request, current-loop query, numeric frame advancement and blend update', 'one-track material sampling and interpolation', 'XA node keys and bounded mode-0 local pose sampling', 'node hierarchy modifiers, model runtime binding and unskinned mesh projection', 'original menu hit and activation state', 'save word codec and read-only title unlock metadata', 'bounded numbered intro script record spans', 'bounded XX hierarchy/mesh/material metadata, baselines, encoded target matching and embedded images', 'story chapter tables, chapter-end handler, script-finish routing and story save record', 'gameplay row activation dispatch from the original shared menu helper'],
              'host_tests': 'ARM64 macOS native C',
              'original_reference': 'isolated original-function output digests and self-authored fixtures',
              'iphoneos': 'compiled ARM64 archive; device execution unverified',
              'cpu_emulator_in_product': False, 'game_playability': 'not verified',
              'native_source_sha256': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
                  for p in ['native/resource/dc_pp.c', 'native/resource/dc_image.c', 'native/resource/dc_xa.c', 'native/resource/dc_xx.c', 'native/resource/dc_xl.c', 'native/resource/dc_eyeneck.c', 'native/render/dc_sprite.c', 'native/render/dc_sprite_vertices.c', 'native/game/dc_startup.c', 'native/game/dc_animation.c', 'native/game/dc_material.c', 'native/game/dc_pose.c', 'native/game/dc_scene.c', 'native/game/dc_model.c', 'native/render/dc_mesh.c', 'native/render/dc_mesh_clip.c', 'native/game/dc_menu.c', 'native/game/dc_save.c', 'native/resource/dc_script.c', 'native/game/dc_text.c', 'native/game/dc_skin.c', 'native/game/dc_camera.c', 'native/game/dc_gameplay.c', 'native/game/dc_story.c']}}
          Path('out/native-iphoneos/build-report.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Exercise the actual Apple file adapter on ARM64 macOS
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror -fobjc-arc \
            -Inative/include -Iios/Native tests/native/test_archive_adapter.m \
            ios/Native/DCArchive.m native/resource/dc_pp.c native/resource/dc_image.c -framework Foundation \
            -o "$RUNNER_TEMP/portlab-archive-adapter-test"
          "$RUNNER_TEMP/portlab-archive-adapter-test"
      - name: Exercise the actual Swift resource-pack importer
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/portlab-import-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 tools/resource_import_fixture.py --output "$fixture"
          xcrun swiftc -parse-as-library ios/Sources/ResourcePackImporter.swift tests/native/test_resource_import.swift \
            -o "$RUNNER_TEMP/portlab-resource-import-test"
          "$RUNNER_TEMP/portlab-resource-import-test" "$fixture"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: reconstructed-native-iphoneos-core
          path: out/native-iphoneos/*
