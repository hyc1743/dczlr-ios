name: Verify reconstructed native modules on ARM64 and iPhoneOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run native C behavior tests on ARM64 macOS
        run: |
          python3 - <<'PY'
          import platform
          assert platform.machine() == 'arm64', platform.machine()
          PY
          python3 -m unittest discover -s tests -p 'test_native*.py' -v
      - name: Compile the reconstructed modules for an iOS device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/native-iphoneos
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/resource/dc_pp.c -o out/native-iphoneos/dc_pp.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/resource/dc_image.c -o out/native-iphoneos/dc_image.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/render/dc_sprite.c -o out/native-iphoneos/dc_sprite.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/render/dc_sprite_vertices.c -o out/native-iphoneos/dc_sprite_vertices.o
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -std=c11 -O2 -Wall -Wextra -Werror \
            -Inative/include -c native/game/dc_startup.c -o out/native-iphoneos/dc_startup.o
          xcrun --sdk iphoneos libtool -static out/native-iphoneos/dc_pp.o out/native-iphoneos/dc_image.o out/native-iphoneos/dc_sprite.o out/native-iphoneos/dc_sprite_vertices.o out/native-iphoneos/dc_startup.o \
            -o out/native-iphoneos/libportlab_native.a
          file out/native-iphoneos/dc_pp.o
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          result = {'source_revision': os.environ['GITHUB_SHA'],
              'modules': ['indexed PP resource reader and byte codec', 'BMP/TGA/EMA RGBA decoder', 'sprite draw submission plan and vertex generation', 'two-card startup update action planner'],
              'host_tests': 'ARM64 macOS native C',
              'original_reference': 'synthetic decoder output digests recorded offline',
              'iphoneos': 'compiled ARM64 archive; device execution unverified',
              'cpu_emulator_in_product': False, 'game_playability': 'not verified',
              'native_source_sha256': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
                  for p in ['native/resource/dc_pp.c', 'native/resource/dc_image.c', 'native/render/dc_sprite.c', 'native/render/dc_sprite_vertices.c', 'native/game/dc_startup.c']}}
          Path('out/native-iphoneos/build-report.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Exercise the actual Apple file adapter on ARM64 macOS
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror -fobjc-arc \
            -Inative/include -Iios/Native tests/native/test_archive_adapter.m \
            ios/Native/DCArchive.m native/resource/dc_pp.c native/resource/dc_image.c -framework Foundation \
            -o "$RUNNER_TEMP/portlab-archive-adapter-test"
          "$RUNNER_TEMP/portlab-archive-adapter-test"
      - uses: actions/upload-artifact@v4
        with:
          name: reconstructed-native-iphoneos-core
          path: out/native-iphoneos/*
