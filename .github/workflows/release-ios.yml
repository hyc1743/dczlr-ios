name: Publish development iOS IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Development release tag
        required: true
        type: string
      validation_run:
        description: Successful scoped iOS simulator validation run
        required: true
        default: '40424126130'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select development release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${INPUT_TAG:-$REF_NAME}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Verify scoped simulator validation matches release code
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run || '40424126130' }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          python3 tools/verify_release_validation.py --run "$VALIDATION_RUN" --tag "$RELEASE_TAG" --output out/release-validation.json
      - name: Run portable and release packaging checks
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests
          python3 tools/validate_release_contract.py .
      - name: Install XcodeGen and shader tools
        run: brew install xcodegen glslang spirv-tools
      - name: Prepare pinned MoltenVK and shaders
        run: |
          python3 tools/bootstrap_moltenvk.py --notices-output ios/Generated/MoltenVKNotices
          python3 tools/build_sprite_shaders.py --output ios/Generated/sprite-shaders
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build unsigned ARM64 device app
        working-directory: ios
        run: |
          xcodebuild -project PortLab.xcodeproj -scheme PortLab -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p build/release-ipa/Payload
          cp -R build/release/Build/Products/Release-iphoneos/PortLab.app build/release-ipa/Payload/
          (cd build/release-ipa && zip -qry "../DCZL-R-unsigned.ipa" Payload)
      - name: Inspect actual IPA and write release report
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          RELEASE_BUILD=$(python3 -c 'import re;from pathlib import Path;print(re.search(r"CFBundleVersion:\s*\"([0-9]+)\"",Path("ios/project.yml").read_text())[1])')
          python3 tools/verify_ipa.py --ipa ios/build/DCZL-R-unsigned.ipa \
            --manifest ios/Resources/DczlrData.manifest.json --version "${RELEASE_TAG#v}" \
            --build "$RELEASE_BUILD" --output out/ipa-inspection.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          package=json.loads(Path('out/ipa-inspection.json').read_text())
          validation=json.loads(Path('out/release-validation.json').read_text())
          report={**package,'release_channel':'development prerelease',
              'source_revision':os.environ['GITHUB_SHA'],'release_run':os.environ['GITHUB_RUN_ID'],
              'validation':validation,'portable_checks':'passed in release workflow',
              'known_limitations':['evolved character/outfit actions and remaining camera modes incomplete',
                  'secondary view and save/edit screens incomplete','complete story and original visual equivalence not established',
                  'physical device execution and signing not tested'],
              'resources':'external; existing Documents/game/Data can be reused',
              'fidelity_report':'docs/original-fidelity.md'}
          Path('ios/build/build-report.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('ios/build/DCZL-R-unsigned.ipa.sha256').write_text(package['sha256']+'  DCZL-R-unsigned.ipa\n')
          PY
      - name: Retain release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DCZL-R-device-release
          path: |
            ios/build/DCZL-R-unsigned.ipa
            ios/build/DCZL-R-unsigned.ipa.sha256
            ios/build/build-report.json
            ios/Resources/DczlrData.manifest.json
            out/ipa-inspection.json
            out/release-validation.json
      - name: Publish development GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > out/existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          existing=json.loads(Path('out/existing-release.json').read_text())
          assert existing['isDraft'] and existing['targetCommitish']==os.environ['GITHUB_SHA'], 'Refusing to replace an existing release'
          PY
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --title "$RELEASE_TAG (test build)" \
              --notes-file "docs/releases/$RELEASE_TAG.md" --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" \
            ios/build/DCZL-R-unsigned.ipa \
            ios/build/DCZL-R-unsigned.ipa.sha256 \
            ios/build/build-report.json \
            ios/Resources/DczlrData.manifest.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
